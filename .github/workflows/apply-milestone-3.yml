name: Apply and Deploy Travel Planner Milestone 3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Milestone 3 application files
        shell: bash
        run: |
          PAYLOAD=''
          printf '%s' "$PAYLOAD" | base64 --decode > /tmp/milestone3.tgz
          tar -xzf /tmp/milestone3.tgz --strip-components=1 -C "$GITHUB_WORKSPACE"

      - name: Install dependencies and validate production build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit validated Milestone 3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json             src/App.tsx             src/app/AppShell.tsx             src/shared/components/SidebarNavigation.tsx             src/data/services/databaseService.ts             src/data/services/tripService.ts             src/data/utils/tripDate.ts             src/shared/components/TripCard.tsx             src/features/trips/TripWizardScreen.tsx             src/features/trips/TripEditScreen.tsx             src/features/trips/TripsScreen.tsx             src/features/trips/TripDashboardScreen.tsx             src/styles/global.css
          if git diff --cached --quiet; then
            echo "No Milestone 3 application changes to commit."
          else
            git commit -m "Add Travel Planner Milestone 3 trip management"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: apply-and-build

    steps:
      - name: Deploy Milestone 3 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
