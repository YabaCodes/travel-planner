name: Apply Travel Planner Milestone 13 V1 Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-milestone-13.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Milestone 13 application files
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/milestone-13.tgz
          tar -xzf /tmp/milestone-13.tgz -C .

          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["version"] = "0.13.0"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text())
          lock["version"] = "0.13.0"
          if "" in lock.get("packages", {}):
              lock["packages"][""]["version"] = "0.13.0"
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")
          PY

      - name: Install dependencies and validate production build
        run: |
          npm ci
          npm run build

      - name: Commit validated Milestone 13
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts src
          if git diff --cached --quiet; then
            echo "No Milestone 13 changes to commit."
            exit 0
          fi
          git commit -m "Add Travel Planner Milestone 13 V1 hardening"
          git push origin HEAD:main

      - name: Trigger permanent Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
