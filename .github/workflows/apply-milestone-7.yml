name: Apply Travel Planner Milestone 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-milestone-7.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Milestone 7 application files
        shell: bash
        run: |
          PAYLOAD=''
          printf '%s' "$PAYLOAD" | base64 --decode > /tmp/milestone7.tgz
          tar -xzf /tmp/milestone7.tgz -C "$GITHUB_WORKSPACE"

      - name: Install dependencies and validate production build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit validated Milestone 7
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src
          if git diff --cached --quiet; then
            echo "No Milestone 7 application changes to commit."
          else
            git commit -m "Add Travel Planner Milestone 7 bookings"
            git push
          fi

      - name: Trigger permanent Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
