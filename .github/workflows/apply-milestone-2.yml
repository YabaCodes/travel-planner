name: Apply Travel Planner Milestone 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-milestone-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-milestone-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Milestone 2 files
        shell: bash
        run: |
          PAYLOAD=''
          printf '%s' "$PAYLOAD" | base64 --decode > /tmp/milestone2.tgz
          tar -xzf /tmp/milestone2.tgz --strip-components=1 -C "$GITHUB_WORKSPACE"

      - name: Install and validate production build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit validated Milestone 2
        shell: bash
        run: |
          # Workflow files cannot be changed by the GitHub Actions token in this repo.
          # Restore the existing deployment workflow and commit only application/data files.
          git checkout -- .github/workflows/deploy-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Milestone 2 application changes to commit."
            exit 0
          fi
          git commit -m "Add Travel Planner Milestone 2 data foundation"
          git push
